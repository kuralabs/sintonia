# Sintonía behind NGINX, with HTTPS.
#
# Browsers need HTTPS to keep a phone's screen on while watching and to
# install Sintonía to the home screen. Run Sintonía with
#
#   [server]
#   host = '127.0.0.1'
#   port = 8099
#
# so that only NGINX reaches it, and replace tv.example.com with your name.
#
# NGINX carries the page, the API, the state updates (Server-Sent Events on
# /api/events) and the WebRTC signalling (/whep/). The video itself does not
# pass through NGINX: browsers receive it from Sintonía directly over UDP
# port 8189, so that port must be reachable from the clients (it is, with
# --network host and no firewall in between).
#
# Sintonía has no login, and every viewer can tie up a tuner: keep it on
# your LAN or VPN. If this server is reachable from the internet, uncomment
# the allow/deny lines and list your networks.

upstream sintonia {
    server 127.0.0.1:8099;
    keepalive 8;
}

server {
    server_name tv.example.com;

    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    ssl_certificate /etc/letsencrypt/live/tv.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tv.example.com/privkey.pem;

    # allow 192.168.0.0/16;
    # allow 10.0.0.0/8;
    # deny all;

    add_header X-Content-Type-Options 'nosniff' always;
    add_header Referrer-Policy 'same-origin' always;
    add_header Permissions-Policy 'fullscreen=(self), screen-wake-lock=(self), camera=(), microphone=(), geolocation=()' always;
    # Everything comes from this origin. WebRTC media is not subject to CSP.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    gzip on;
    gzip_types text/css application/javascript text/javascript
        application/json application/manifest+json image/svg+xml;

    location / {
        proxy_pass http://sintonia;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # State updates: one long-lived response per open page. Sintonía sends
    # a ping every 15 seconds and asks NGINX not to buffer; this makes both
    # explicit.
    location = /api/events {
        proxy_pass http://sintonia;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}

server {
    server_name tv.example.com;

    listen 80;
    listen [::]:80;

    return 301 https://$host$request_uri;
}
