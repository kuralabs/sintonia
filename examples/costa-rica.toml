# Sintonía example configuration: Costa Rica (ISDB-Tb), Gran Área
# Metropolitana, as received during development in November 2026.
#
# Everything except [[channels]] is optional; the values shown are the
# defaults unless noted. Generate your own channel list with:
#
#   dvbv5-scan -o channels.conf scan-table.conf
#   sintonia import channels.conf
#
# Channel numbers for services that do not carry one in their name are
# derived from the RF channel (Telefides and Teleuno are on UHF 40).

[server]
host = '0.0.0.0'
port = 8080

[tuners]
# Empty: every /dev/dvb/adapterN present at start-up.
adapters = []
prewarm = true

[transcode]
hwaccel = 'nvidia'
# NVIDIA device index. Run the container with --gpus all and choose the
# GPU here: a container given a single GPU other than GPU 0 cannot use
# NVENC.
gpu = 0
output = '1080p60'
video_bitrate = '8M'
# Costa Rican channels differ by more than 10 LU in loudness.
audio_normalize = true


[[channels]]
number = '3.1'
name = 'CANAL 3'
frequency = 491142857
service_id = 3744

